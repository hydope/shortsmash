[project]
name = "shortsmash"
version = "0.3.0"
description = "Prompt in. Finished short out. AI video studio: script, voice, stock, edit, captions, and official-API publishing to YouTube, TikTok, Instagram and X."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ShortSmash" }]
requires-python = ">=3.10"
keywords = ["video", "shorts", "reels", "tiktok", "youtube", "ai-video", "ffmpeg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.25",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
    "creator-publish>=0.1.0",
]

[project.optional-dependencies]
ai = ["google-genai>=1.0"]
voice = ["edge-tts>=6.1", "gtts>=2.5"]
captions = ["faster-whisper>=1.0"]
youtube = ["google-api-python-client>=2.0", "google-auth-oauthlib>=1.0"]
x = ["tweepy>=4.14"]
schedule = ["apscheduler>=3.10"]
trends = ["pytrends>=4.9"]
vision = ["torch", "transformers", "pillow"]
images = ["pillow>=10"]  # lightweight: template images only, no torch
# Optional, for ShortSmash Social clip face scoring only. Pinned below 5
# on purpose: opencv-python-headless 5.x removed CascadeClassifier,
# which repurpose.py uses. Install with: pip install "shortsmash[face]"
face = ["opencv-python-headless>=4.10,<5"]
mcp = ["mcp<2"]
web = ["fastapi>=0.100", "uvicorn>=0.20"]
bluesky = ["httpx>=0.25"]
threads = ["httpx>=0.25"]

[project.scripts]
shortsmash = "shortsmash.cli:app"
shortsmash-mcp = "shortsmash.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shortsmash"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/demo/*.mp4",
    "/launch/fb-posts/*.mp4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
